<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>船舶テスト海</title>
<style>
:root{--bg:#0b1722;--pn:#10202ff0;--ln:#2e5576;--tx:#e6edf3;--mu:#8da0b0;--ac:#4cc2ff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12px/1.35 -apple-system,"Hiragino Sans",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.pn{position:fixed;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:6px 8px}
#top{top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));width:min(250px,60vw);max-height:46vh;overflow:auto;touch-action:pan-y}
#bar{bottom:calc(8px + env(safe-area-inset-bottom));left:calc(150px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));display:none}
@media (max-width:700px){#bar{left:calc(8px + env(safe-area-inset-left));bottom:calc(150px + env(safe-area-inset-bottom))}}
button{background:#25415a;color:var(--tx);border:1px solid #3b6288;border-radius:7px;padding:5px 9px;font-size:12px;min-height:30px;margin:2px 2px 2px 0}
button.on{background:var(--ac);color:#04202e}
.row{display:flex;align-items:center;gap:6px}.row label{flex:0 0 5.5em;color:var(--mu)}.row input{flex:1;min-width:0}.row output{flex:0 0 3.6em;text-align:right}
h4{margin:4px 0 2px;font-size:12px;color:#7fc8f0}
#info{font-size:11px;color:#9fc4de;margin-bottom:2px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));background:#000c;color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#stick{position:fixed;left:calc(16px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;border:2px solid #ffffff55;background:#ffffff12;display:none;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#ffffffaa}
</style></head><body>
<canvas id="c"></canvas>
<button id="bMenu" style="position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right))">☰ メニュー</button>
<div id="top" class="pn">
  <h4>船を出す（原点の海）</h4><div id="spawns"></div>
  <h4>船</h4><div id="list"></div>
  <h4>天候</h4>
  <div class="row"><label>風速</label><input id="ws" type="range" min="0" max="25" step="0.5" value="10"><output id="wsO"></output></div>
  <div class="row"><label>風の来る方位</label><input id="wd" type="range" min="0" max="359" step="1" value="0"><output id="wdO"></output></div>
  <div class="row"><button id="bX">倍速 ×1</button><button id="bClear">船を全部消す</button><button id="bEvid">史料と推定</button></div>
  <div style="color:var(--mu)">地図：島4つ（周りの浅瀬は水色の輪）。海をタップすると、乗船中の船の目的地になります。ドラッグで視点、ホイール／ピンチで拡大。</div>
</div>
<div id="bar" class="pn"><div id="info"></div><div id="ctrl"></div><div id="ladders" style="position:fixed;left:calc(150px + env(safe-area-inset-left));bottom:calc(86px + env(safe-area-inset-bottom));z-index:6"></div></div>
<div id="evid" class="pn" style="display:none;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));width:min(620px,94vw);max-height:84vh;overflow:auto;touch-action:pan-y;z-index:8"></div>
<div id="stick"><div id="knob"></div></div>
<div id="toast"></div>
<script>/*THREE*/</script>
<script>
/*BUNDLE*/
(() => {
'use strict';
const T = THREE, DEG = Math.PI / 180, $ = (id) => document.getElementById(id);
const el = (tag, props = {}, kids = []) => { const e = Object.assign(document.createElement(tag), props); for (const k of kids) e.append(k); return e; };
const SAVE_KEY = 'woh-ship-sandbox-v1';

// ---------- the world: open sea with four islands; depth, wind and current come through the same env interface the game uses ----------
const ISLANDS = [{ x: 900, y: -600, r: 220 }, { x: -1200, y: 1400, r: 320 }, { x: 2600, y: 900, r: 180 }, { x: -300, y: -2400, r: 400 }], SHELF = 220, SEA_DEPTH = 60;
const wind = { from: 0, speed: 10 };
const windVec = () => ({ x: -Math.sin(wind.from * DEG) * wind.speed, y: -Math.cos(wind.from * DEG) * wind.speed });
const env = {
  wind: () => windVec(), current: () => ({ x: 0, y: 0 }), seabed: 'sand',
  depth(X, Y) { let d = SEA_DEPTH; for (const i of ISLANDS) { const dist = Math.hypot(X - i.x, Y - i.y); if (dist < i.r) return 0; if (dist < i.r + SHELF) d = Math.min(d, SEA_DEPTH * (dist - i.r) / SHELF); } return d; },
};

// ---------- scene ----------
const canvas = $('c'), renderer = new T.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new T.Scene(); scene.background = new T.Color(0xa8c8dc); scene.fog = new T.Fog(0xa8c8dc, 1500, 9000);
scene.add(new T.HemisphereLight(0xd8efff, 0x4b6a80, 0.95)); const sun = new T.DirectionalLight(0xffffff, 0.85); sun.position.set(-40, 80, -30); scene.add(sun);
const camera = new T.PerspectiveCamera(60, 1, 0.3, 20000);
// Sea: one big plane that follows the camera; a tiled texture scrolls so motion is visible.
const tex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); g.fillStyle = '#1b6f9c'; g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 90; i++) { g.fillStyle = `rgba(255,255,255,${0.04 + Math.random() * 0.09})`; const x = Math.random() * 128, y = Math.random() * 128; g.fillRect(x, y, 6 + Math.random() * 14, 1.5); g.fillRect((x + 128) % 128, (y + 128) % 128, 6, 1.5); }
  const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; return t; })();
const TILE = 40, SEA = new T.Mesh(new T.PlaneGeometry(24000, 24000), new T.MeshLambertMaterial({ map: tex })); SEA.rotation.x = -Math.PI / 2; scene.add(SEA); tex.repeat.set(24000 / TILE, 24000 / TILE);
function placeSea() { SEA.position.set(camera.position.x, 0, camera.position.z); const ox = (camera.position.x / TILE) % 1, oy = (camera.position.z / TILE) % 1; tex.offset.set(ox, -oy); }
// Islands (world x = east, z = south, so z = -Y).
for (const i of ISLANDS) {
  const g = new T.Group(); g.position.set(i.x, 0, -i.y);
  const ring = new T.Mesh(new T.RingGeometry(i.r, i.r + SHELF, 48), new T.MeshBasicMaterial({ color: 0x66e0e8, transparent: true, opacity: 0.4, depthWrite: false })); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.2; g.add(ring);
  const sand = new T.Mesh(new T.CylinderGeometry(i.r, i.r * 1.04, 8, 32), new T.MeshLambertMaterial({ color: 0xd8c48a })); sand.position.y = 1.5; g.add(sand);
  const hill = new T.Mesh(new T.ConeGeometry(i.r * 0.7, i.r * 0.35, 24), new T.MeshLambertMaterial({ color: 0x5c8a4a })); hill.position.y = 5.5 + i.r * 0.17; g.add(hill);
  scene.add(g);
}
// Origin marker so the start point is easy to find.
const buoy = new T.Mesh(new T.CylinderGeometry(1, 1, 6, 8), new T.MeshLambertMaterial({ color: 0xff5a3c })); buoy.position.set(0, 3, 0); scene.add(buoy);

// ---------- ships ----------
let fleet = null, objs = new Map(), boarded = null, speedX = 1, ctl = {}, players = new Map();
function newFleet() { fleet = Ship.createFleet({ nearRadiusM: 1e9, farRadiusM: 1e9 }); for (const [id, d] of Object.entries(Ship.sampleDesigns)) fleet.registerDesign(id, d); }
function makeObj(rec) {
  const dd = Ship.sampleDesigns[rec.designId], isPinta = !!dd.evidence;
  const o = Ship.buildShipObject(T, { hull: dd.hull, vessel: rec.vessel, visual: { ...dd.visual, customRig: isPinta } }); scene.add(o.group);
  if (isPinta) Ship.addPintaStructure(T, o, dd, rec.vessel);
  const pl = new T.Group(), body = new T.Mesh(new T.CylinderGeometry(0.28, 0.28, 1.2, 10), new T.MeshLambertMaterial({ color: 0xe5b348 })), head = new T.Mesh(new T.SphereGeometry(0.24, 12, 8), new T.MeshLambertMaterial({ color: 0xf2d08a }));
  body.position.set(0, 0.6, 0); head.position.set(0, 1.45, 0); pl.add(body, head);
  pl.visible = false; o.group.add(pl); o.player = pl;
  const d = Ship.sampleDesigns[rec.designId];
  o.interior = Ship.createInterior(d.interior ?? Ship.sampleInteriors[d.interiorId], { hull: Ship.createHull(d.hull) });
  if (rec.crew) Ship.addCrewFigures(T, o, rec.crew); else o.crewFigs = [];
  Ship.addInterior(T, o, o.interior); o.pos = o.interior.startPosition(); o.facing = 0; Ship.placePlayer(o, o.pos); Ship.setViewDeck(o, o.pos.deck); return o;
}
function spawn(designId) {
  const n = fleet.list().length, X = (n % 4) * 90 - 135, Y = -Math.floor(n / 4) * 90 - 40;
  const heading = (wind.from + 90) % 360; // beam reach to start
  const id = fleet.addShip({ designId, X, Y, headingDeg: heading, crew: !!Ship.sampleDesigns[designId].evidence }); fleet.get(id).vessel.state.u = 1.5;
  ctl[id] = { heading, held: 0, auto: true, oar: 0.8 }; toast(`${id} を出した`); refresh(); save();
}
function removeAll() { for (const o of objs.values()) { scene.remove(o.group); o.dispose(); } objs.clear(); newFleet(); ctl = {}; boarded = null; refresh(); save(); }

// ---------- camera orbit ----------
const cam = { yaw: 0.8, pitch: 0.45, dist: 70, tx: 0, ty: 3, tz: 0 };
function updateCamera() {
  let t = { x: cam.tx, y: cam.ty, z: cam.tz };
  if (boarded && objs.has(boarded)) { const o = objs.get(boarded), v = new T.Vector3(); (o.player.visible ? o.player : o.group).getWorldPosition(v); t = { x: v.x, y: v.y + 1.4, z: v.z }; cam.tx = t.x; cam.ty = t.y; cam.tz = t.z; }
  const cp = Math.cos(cam.pitch);
  camera.position.set(t.x + Math.sin(cam.yaw) * cp * cam.dist, Math.max(1.5, t.y + Math.sin(cam.pitch) * cam.dist), t.z + Math.cos(cam.yaw) * cp * cam.dist);
  camera.lookAt(t.x, t.y, t.z);
}
const ptrs = new Map(); let tapStart = null, pinch = null;
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 1) tapStart = { x: e.clientX, y: e.clientY, t: performance.now() }; else { tapStart = null; pinch = null; } });
canvas.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (ptrs.size === 1) { cam.yaw -= (e.clientX - p.x) * 0.006; cam.pitch = Math.min(1.4, Math.max(0.05, cam.pitch + (e.clientY - p.y) * 0.005)); }
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch) cam.dist = Math.min(600, Math.max(8, cam.dist * pinch / d)); pinch = d; }
});
const endPtr = (e) => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; };
canvas.addEventListener('pointerup', (e) => { if (tapStart && Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) < 8 && performance.now() - tapStart.t < 450) onTap(e); tapStart = null; endPtr(e); });
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist = Math.min(600, Math.max(8, cam.dist * (1 + Math.sign(e.deltaY) * 0.1))); }, { passive: false });
function onTap(e) {
  if (!boarded) return;
  const r = canvas.getBoundingClientRect(), ray = new T.Raycaster(); ray.setFromCamera(new T.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const hit = new T.Vector3(); if (!ray.ray.intersectPlane(new T.Plane(new T.Vector3(0, 1, 0), 0), hit)) return;
  setDest(boarded, hit.x, -hit.z);
}

// ---------- captain / destination ----------
const REASON = { destination_too_shallow: 'そこは浅くて行けない', blocked: '回り込む道がない', search_limit: '遠すぎて航路を決められない' };
const EVT = { captain_route_planned: '航路を決めた', captain_tack: '帆の向きを替えた', captain_reef: '帆を絞った', captain_arriving: '目的地に近づいた', captain_arrived: '到着した', captain_replan: '浅瀬を避けて航路を引き直した', captain_cancelled: '航海をやめた', grounded: '座礁した', refloated: '離礁した', anchor_dropped: '錨を下ろした', anchor_raised: '錨を上げた', anchor_dragging: '錨が走っている', anchor_parted: '錨索が切れた' };
const active = (rec) => !!rec.captain && ['sailing', 'arriving'].includes(rec.captain.mode);
function setDest(id, X, Y) {
  const r = fleet.setDestination(id, env, { X, Y });
  if (r.status !== 'ok') { toast('船長：' + (REASON[r.reason] ?? '行けない')); return; }
  toast('目的地を決めた'); refresh(); save();
}
const routeMat = new T.LineBasicMaterial({ color: 0xffe14a, depthTest: false }); let routeLine = null, destBall = null;
function drawRoute() {
  for (const o of [routeLine, destBall]) if (o) { scene.remove(o); o.geometry.dispose(); }
  routeLine = destBall = null;
  const rec = boarded && fleet.has(boarded) ? fleet.get(boarded) : null; if (!rec || !active(rec)) return;
  const c = rec.captain, pts = [rec.vessel.state, ...c.waypoints.slice(c.waypointIndex)].map((w) => new T.Vector3(w.X ?? w.x, 1.5, -(w.Y ?? w.y)));
  routeLine = new T.Line(new T.BufferGeometry().setFromPoints(pts), routeMat); routeLine.renderOrder = 5; scene.add(routeLine);
  destBall = new T.Mesh(new T.SphereGeometry(6, 10, 8), new T.MeshBasicMaterial({ color: 0xffe14a, depthTest: false })); destBall.position.set(c.destination.X, 3, -c.destination.Y); destBall.renderOrder = 5; scene.add(destBall);
}

// ---------- player on deck ----------
const stick = { x: 0, y: 0 };
function walk(dt) {
  if (!boarded || !objs.has(boarded)) return;
  const o = objs.get(boarded), kx = (keys.has('KeyD') || keys.has('ArrowRight')) - (keys.has('KeyA') || keys.has('ArrowLeft')), ky = (keys.has('KeyS') || keys.has('ArrowDown')) - (keys.has('KeyW') || keys.has('ArrowUp'));
  const sx = stick.x + kx, sy = stick.y + ky, m = Math.hypot(sx, sy); if (m < 0.08) return;
  // stick up = away from the camera; convert the world direction to ship-local axes
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = -fz, rz = fx;
  const w = new T.Vector3(fx * -sy + rx * sx, 0, fz * -sy + rz * sx).normalize().multiplyScalar(Math.min(1, m) * 2.8 * dt);
  const q = o.group.getWorldQuaternion(new T.Quaternion()).invert(), l = w.applyQuaternion(q);
  // group axes: x = starboard (+y of the hull frame), z = -forward, so hull dx = -l.z and dy = l.x
  const before = o.pos; o.pos = o.interior.move(o.pos, -l.z, l.x); o.facing = Math.atan2(l.x, l.z);
  if (o.pos.x !== before.x || o.pos.y !== before.y) o.player.rotation.y = o.facing;
}
const keys = new Set(); addEventListener('keydown', (e) => keys.add(e.code)); addEventListener('keyup', (e) => keys.delete(e.code));
(() => { const s = $('stick'), k = $('knob'); let id = null; const set = (e) => { const r = s.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), m = Math.hypot(dx, dy), c = Math.min(1, m / 45); stick.x = m ? dx / m * c : 0; stick.y = m ? dy / m * c : 0; k.style.left = 35 + stick.x * 35 + 'px'; k.style.top = 35 + stick.y * 35 + 'px'; };
  s.addEventListener('pointerdown', (e) => { id = e.pointerId; s.setPointerCapture(id); set(e); e.stopPropagation(); }); s.addEventListener('pointermove', (e) => { if (e.pointerId === id) set(e); });
  const end = (e) => { if (e.pointerId === id) { id = null; stick.x = stick.y = 0; k.style.left = k.style.top = '35px'; } }; s.addEventListener('pointerup', end); s.addEventListener('pointercancel', end); })();

// ---------- HUD ----------
let toastT = 0; function toast(t) { const e = $('toast'); e.textContent = t; e.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => { e.style.opacity = 0; }, 3000); }
for (const id of ['pinta-1492', 'pinta-1492-lateen', 'galleon', 'galley']) $('spawns').append(el('button', { textContent: Ship.sampleDesigns[id].label, onclick: () => spawn(id) }));
function board(id) { boarded = id; const o = objs.get(id); if (o) { o.player.visible = true; } for (const [k, x] of objs) if (k !== id) { x.player.visible = false; Ship.setViewDeck(x, x.weatherDeck); } refresh(); toast(`${id} に乗った`); }
function disembark() { if (!boarded) return; const o = objs.get(boarded); if (o) { o.player.visible = false; Ship.setViewDeck(o, o.weatherDeck); } boarded = null; refresh(); }
function refresh() {
  const L = $('list'); L.replaceChildren(...fleet.list().map((r) => el('div', { className: 'row' }, [el('span', { textContent: `${r.id}（${Ship.sampleDesigns[r.designId].label}）`, style: 'flex:1' }),
    el('button', { textContent: boarded === r.id ? '降りる' : '乗る', className: boarded === r.id ? 'on' : '', onclick: () => (boarded === r.id ? disembark() : board(r.id)) }),
    el('button', { textContent: '消す', onclick: () => { const o = objs.get(r.id); if (o) { scene.remove(o.group); o.dispose(); objs.delete(r.id); } fleet.removeShip(r.id); delete ctl[r.id]; if (boarded === r.id) boarded = null; refresh(); save(); } })])));
  const C = $('ctrl'); C.replaceChildren(); $('bar').style.display = boarded && fleet.has(boarded) ? 'block' : 'none'; $('stick').style.display = boarded ? 'block' : 'none';
  if (!boarded || !fleet.has(boarded)) return;
  const rec = fleet.get(boarded), v = rec.vessel, c = ctl[boarded];
  const hold = (label, dir) => { const b = el('button', { textContent: label }); b.addEventListener('pointerdown', (e) => { e.preventDefault(); c.held = dir; }); for (const t of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(t, () => { if (c.held === dir) c.held = 0; }); return b; };
  C.append(hold('◀ 左へ', -1), hold('右へ ▶', 1), el('button', { textContent: '前方3km', onclick: () => { const s = v.state; setDest(boarded, s.X + Math.sin(s.psi) * 3000, s.Y + Math.cos(s.psi) * 3000); } }));
  if (active(rec)) C.append(el('button', { textContent: '航海をやめる', onclick: () => { fleet.cancelDestination(boarded); v.setHeadingTarget(null); c.heading = v.snapshot().headingDeg; drawRoute(); refresh(); } }));
  C.append(el('button', { textContent: v.state.anchor ? '錨を上げる' : '錨を下ろす', onclick: () => { if (v.state.anchor) v.raiseAnchor(); else { const r = v.dropAnchor(env, { anchorKg: 400, rodeM: 60 }); if (r.status !== 'ok') toast('投錨できない：' + r.status); } refresh(); } }));
  if (rec.crew) C.append(el('button', { textContent: '樽±10', onclick: () => { toggleCargo(); refresh(); } }), el('button', { textContent: '8月の舵故障', onclick: startScenario }));
  if (v.sails.length) C.append(el('button', { textContent: c.auto ? '帆：自動' : '帆：固定', className: c.auto ? 'on' : '', onclick: () => { c.auto = !c.auto; refresh(); } }));
  if (v.oars.length) { const r = el('input', { type: 'range', min: -100, max: 100, step: 5, value: Math.round(c.oar * 100), style: 'width:90px' }); r.oninput = () => { c.oar = r.value / 100; }; C.append(el('span', { textContent: '櫂 ' }), r); }
}
let ladderSig = '';
function ladderUi() {
  const o = boarded && objs.get(boarded); const wrap = $('ladders'); if (!o) { wrap.replaceChildren(); ladderSig = ''; return; }
  const near = o.interior.laddersNear(o.pos), sig = near.map((l) => l.id).join(',');
  if (sig === ladderSig) return; ladderSig = sig;
  wrap.replaceChildren(...near.map((l) => el('button', { textContent: l.direction === 'up' ? '上る' : '下りる', className: 'on', onclick: () => { o.pos = o.interior.climb(o.pos, l.id); ladderSig = ''; } })));
}
function info() {
  if (!boarded || !fleet.has(boarded)) return;
  ladderUi();
  const rec = fleet.get(boarded), v = rec.vessel, s = v.snapshot(), f = v.forces(env), w = windVec(), cap = rec.captain;
  const dd = cap?.destination && Math.hypot(cap.destination.X - v.state.X, cap.destination.Y - v.state.Y);
  const capTxt = cap && active(rec) ? `／航海中 残り${dd > 1000 ? (dd / 1000).toFixed(1) + 'km' : Math.round(dd) + 'm'}（約${Math.round(dd / Math.max(0.8, s.speedOverGround) / 60)}分）${cap.reef < 1 ? '／帆を絞っている' : ''}` : cap?.mode === 'arrived' ? '／到着' : '';
  const here = objs.get(boarded), room = here ? here.interior.roomOf(here.pos.deck, here.pos.x, here.pos.y) : null, deckName = here?.interior.decks.find((d) => d.id === here.pos.deck)?.name ?? '';
  $('info').textContent = `現在地：${room?.name ?? deckName}／速度 ${(s.speedOverGround * 1.9438).toFixed(1)} kt／方位 ${s.headingDeg.toFixed(0)}°／風 ${Math.hypot(w.x, w.y).toFixed(1)} m/s・${wind.from.toFixed(0)}°から／傾斜 ${s.heelDeg.toFixed(1)}°／水深余裕 ${f.clearanceM.toFixed(1)} m${rec.crew ? `／喫水 ${v.params.draftM.toFixed(2)} m／舵${s.rudderHealth < 1 ? '損傷' + Math.round(s.rudderHealth * 100) + '%' : '正常'}／${rec.crew.effects().helmManned ? '操舵手あり' : '操舵手なし'}・帆の手${rec.crew.effects().sailHands}人` : ''}${s.aground ? '／座礁中' : ''}${s.anchored ? (s.anchorDragging ? '／走錨中' : '／錨泊中') : ''}${capTxt}`;
}
const out = () => { $('wsO').textContent = wind.speed + ' m/s'; $('wdO').textContent = wind.from + '°'; };
$('ws').oninput = () => { wind.speed = +$('ws').value; out(); save(); }; $('wd').oninput = () => { wind.from = +$('wd').value; out(); save(); };
$('bX').onclick = () => { speedX = speedX === 1 ? 4 : speedX === 4 ? 10 : 1; $('bX').textContent = '倍速 ×' + speedX; };
$('bClear').onclick = removeAll;
$('bMenu').onclick = () => { const t = $('top'); t.style.display = t.style.display === 'none' ? 'block' : 'none'; };
$('bMenu').addEventListener('pointerdown', (e) => e.stopPropagation()); $('bMenu').addEventListener('pointerup', (e) => e.stopPropagation());
for (const id of ['top', 'bar']) for (const ev of ['pointerdown', 'pointerup', 'wheel']) $(id).addEventListener(ev, (e) => e.stopPropagation());

// ---------- evidence panel, cargo, scenario ----------
const LV = { A: '史料(A)', B: '研究(B)', C: '類例(C)', D: '仮説(D)', derived: '計算' };
function evidence() {
  const P = Ship.PINTA_1492_PROFILE, G = Ship.PINTA_1492_PARAMS, rows = [], flat = (o, path) => { for (const [k, v] of Object.entries(o)) { if (v && typeof v === 'object' && 'evidence_level' in v) rows.push([path + k, v]); else if (v && typeof v === 'object' && !Array.isArray(v)) flat(v, path + k + '.'); } };
  flat(G, '');
  const td = (t) => `<td style="padding:2px 6px;vertical-align:top">${t}</td>`;
  const fmt = (v) => (typeof v === 'object' ? JSON.stringify(v) : String(v));
  const dims = Object.entries(P.dimensions).map(([k, v]) => `<tr>${td(k)}${td(v.value === null ? '<b>未確定</b>' : v.value + ' ' + v.unit)}${td(LV[v.evidence_level])}${td(v.notes_ja)}</tr>`).join('');
  const hyp = rows.map(([k, v]) => `<tr>${td(k)}${td(fmt(v.value))}${td(LV[v.evidence_level])}${td(v.note)}</tr>`).join('');
  $('evid').innerHTML = `<div class="row"><b style="flex:1;font-size:14px">ピンタ号1492：推定復元（原船の図面は現存しない）</b><button id="evClose">閉じる</button></div>
  <p>採用プロファイル：<b>${P.selected_profile}</b>。数値は学術的な復元案で、原船の実測値ではありません。歴史的容積<b>約40.10 toneladas de arqueo</b>は重量ではなく、排水量・積載量には使っていません。軽荷時の排水量は船体形状と喫水1.58mから計算しています。</p>
  <h4>研究で示された値（資料のまま）</h4><table style="border-collapse:collapse;font-size:11px">${dims}</table>
  <h4>このゲームでの仮説・計算値</h4><table style="border-collapse:collapse;font-size:11px">${hyp}</table>
  <h4>史料に異説・未確定</h4><ul style="margin:2px 0 6px 16px;padding:0"><li>帆装の改装対象：日誌の抄録はピンタ号をラテン帆から横帆へ変更と読めるが、フェルナンド・コロンの記述ではニーニャ号。→「大西洋横断」と「出航時ラテン帆仮説」の2案を保持。</li><li>乗員：26人は初期値。文献で異なる。</li><li>武装：砲の数・口径・位置は未確定（このモデルには砲を付けていない）。</li><li>帆の意匠・旗：未確定（付けていない）。</li><li>${P.unresolved.join(', ')}</li></ul>`;
  $('evClose').onclick = () => { $('evid').style.display = 'none'; };
}
$('bEvid').onclick = () => { const e = $('evid'); if (e.style.display === 'none') { evidence(); e.style.display = 'block'; } else e.style.display = 'none'; };
for (const ev of ['pointerdown', 'pointerup', 'wheel']) $('evid').addEventListener(ev, (e) => e.stopPropagation());
const scenarios = new Map(), HLABEL = { rudder_disengaged: '舵が外れる', rudder_repair_after_repeat_problem: '舵の修理', leak_reported: '漏水の報告' };
function toggleCargo() {
  const rec = fleet.get(boarded), o = objs.get(boarded), has = (rec.massItems ?? []).some((m) => m.id === 'cargo:water_barrel:player');
  const base = rec.massItems ?? Ship.sampleDesigns[rec.designId].massItems;
  fleet.setLoad(boarded, has ? base.filter((m) => m.id !== 'cargo:water_barrel:player') : Ship.withCargo(base, [Ship.cargoItem('water_barrel', 10, 3.5, 0, o.interior.deckZ('hold') + 0.2, 'player')]));
  toast(has ? '樽10個を降ろした' : '水樽10個を船倉の船尾側に積んだ');
}
function startScenario() {
  if (scenarios.has(boarded)) { toast('すでに再現中'); return; }
  scenarios.set(boarded, Ship.createAugust1492({ fleet, shipId: boarded, daySeconds: 900 })); toast('1492年8月の舵故障を再現開始（1日=15分）');
}

// ---------- save / load ----------
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ fleet: fleet.serialize(), ctl, wind })); } catch (_) { /* storage unavailable */ } }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (!d?.fleet) return;
    fleet.restore(d.fleet); ctl = d.ctl ?? {}; Object.assign(wind, d.wind ?? {}); $('ws').value = wind.speed; $('wd').value = wind.from;
  } catch (_) { newFleet(); }
}

// ---------- main loop ----------
let last = null, acc = 0, saveT = 0, infoT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = last === null ? 0 : Math.min((t - last) / 1000, 0.1); last = t;
  const w = innerWidth, h = innerHeight; if (canvas.width !== Math.round(w * renderer.getPixelRatio()) || canvas.height !== Math.round(h * renderer.getPixelRatio())) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  for (const rec of fleet.list()) {
    const c = ctl[rec.id] ??= { heading: rec.vessel.snapshot().headingDeg, held: 0, auto: true, oar: 0.8 }, v = rec.vessel;
    if (active(rec)) { c.heading = v.snapshot().headingDeg; continue; }
    c.heading = (c.heading + c.held * 25 * dt * speedX + 360) % 360; v.setHeadingTarget(c.heading); if (v.oars.length) v.setAllOarEffort(c.oar);
  }
  acc += dt; if (acc > 1) { acc = 0; for (const rec of fleet.list()) if (ctl[rec.id]?.auto && !active(rec)) rec.vessel.autoTrim(env); }
  if (dt > 0) fleet.step(dt * speedX, env, null);
  for (const [sid, sc] of scenarios) { if (!fleet.has(sid)) { scenarios.delete(sid); continue; } sc.update(dt * speedX); for (const e of sc.takeEvents()) toast(`${e.historical.date} ${HLABEL[e.historical.kind]}（史料A）：${e.game.note}`); }
  for (const e of fleet.takeEvents()) { if (e.type === 'captain_no_route') toast('船長：' + (REASON[e.reason] ?? '行けない')); else if (EVT[e.type]) toast(`${e.shipId}：${EVT[e.type]}`); }
  for (const rec of fleet.list()) {
    let o = objs.get(rec.id); if (!o) { o = makeObj(rec); objs.set(rec.id, o); if (boarded === rec.id) o.player.visible = true; }
    const s = rec.vessel.state; o.group.position.set(s.X, 0, -s.Y); o.group.rotation.set(0, -s.psi, -s.heelDeg * DEG); Ship.updateShipObject(o, { leeSign: Math.sign(rec.vessel.apparentWind(env).y) || 1 }); if (o.setDetail) { const dist = camera.position.distanceTo(o.group.position); o.setDetail(dist > 400 ? 2 : dist > 120 ? 1 : 0); }
    Ship.updateCrewFigures(o, boarded === rec.id ? o.pos.deck : null);
    Ship.placePlayer(o, o.pos); if (boarded === rec.id) Ship.setViewDeck(o, o.pos.deck, o.interior.roomOf(o.pos.deck, o.pos.x, o.pos.y)?.id ?? null);
  }
  walk(dt); updateCamera(); placeSea(); if (boarded) drawRoute();
  renderer.render(scene, camera);
  infoT += dt; if (infoT > 0.25) { infoT = 0; info(); }
  saveT += dt; if (saveT > 6) { saveT = 0; save(); }
}
newFleet(); load(); out(); refresh(); addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.__sandbox = { fleet: () => fleet, env, spawn, board, setDest, cam, objs: () => objs, wind, get boarded() { return boarded; } };
requestAnimationFrame(frame);
})();
</script></body></html>
