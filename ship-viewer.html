<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>船舶システム 確認画面</title>
<style>
:root{--bg:#10161c;--pn:#1a232c;--ln:#2e3b47;--tx:#e6edf3;--mu:#8da0b0;--ac:#4cc2ff;--ok:#5fd38d;--wn:#ffb454;--bd:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.35 -apple-system,"Hiragino Sans",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px max(8px,env(safe-area-inset-right)) 8px max(8px,env(safe-area-inset-left));height:100%}
@media (orientation:portrait){#app{grid-template-columns:1fr;grid-template-rows:1fr 1fr;overflow:auto}html,body{overflow:auto}}
.pn{overflow-y:auto;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px;display:flex;flex-direction:column;min-height:0;min-width:0}
h2{margin:0 0 4px;font-size:13px;color:var(--ac);font-weight:600}
canvas{width:100%;flex:1 0 110px;min-height:110px;background:#0c1116;border-radius:6px;display:block}
.row{display:flex;align-items:center;gap:6px;margin-top:1px}
.row label{flex:0 0 7.5em;color:var(--mu);font-size:12px}
.row input[type=range]{flex:1;min-width:0;height:20px}
.row output{flex:0 0 4.6em;text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:2px 10px;margin-top:4px;font-size:12px}
.stats span{color:var(--mu)}.stats b{font-weight:600;font-variant-numeric:tabular-nums}
button{background:#25323d;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:3px 9px;font-size:13px;min-height:30px}
button:disabled{opacity:.4}
button.on{background:var(--ac);color:#04202e;border-color:var(--ac)}
.btns{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
.warn{color:var(--wn)}.bad{color:var(--bd)}.good{color:var(--ok)}
</style></head><body>
<div id="app">
 <section class="pn"><h2>安定性（静水中・仮のガレオン風）</h2>
  <canvas id="cSec"></canvas><canvas id="cGz" style="flex:.8 1 0"></canvas>
  <div class="row"><label>大砲の高さ</label><input id="gun" type="range" min="3" max="12" step="0.25" value="6"><output id="gunO"></output></div>
  <div class="row"><label>見る傾斜角</label><input id="heel" type="range" min="-90" max="90" step="1" value="0"><output id="heelO"></output></div>
  <div class="stats" id="st1"></div>
 </section>
 <section class="pn"><h2>航行（上から見た図）</h2>
  <canvas id="cNav"></canvas>
  <div class="row"><label>風速（m/s）</label><input id="ws" type="range" min="0" max="25" step="0.5" value="10"><output id="wsO"></output></div>
  <div class="row"><label>風の来る方位</label><input id="wd" type="range" min="0" max="359" step="1" value="0"><output id="wdO"></output></div>
  <div class="row"><label>目標方位</label><input id="hd" type="range" min="0" max="359" step="1" value="60"><output id="hdO"></output></div>
  <div class="btns"><button id="bSq">横帆</button><button id="bFa" class="on">縦帆</button><button id="bRun" class="on">動かす</button><button id="bRst">最初から</button><button id="bX2">倍速 ×1</button></div>
  <div class="row"><label>櫂の出力（ガレー）</label><input id="oe" type="range" min="-100" max="100" step="5" value="80"><output id="oeO"></output></div>
  <div class="btns"><button id="bShip">船：ガレオン</button><button id="bAnc">錨を下ろす</button><button id="bShoal">浅瀬：なし</button></div>
  <div class="btns"><button id="bMan">自動操舵</button><button id="bL" disabled>◀ 左舵</button><button id="bR" disabled>右舵 ▶</button><span style="color:var(--mu);font-size:12px;align-self:center">手動：ボタン長押し／←→キー</span></div>
  <div class="stats" id="st2"></div>
 </section>
</div>
<script>
const M_hull_geometry = (() => {
/**
 * World of History ship system: physics hull geometry (independent prototype).
 * Ship-fixed frame, SI units:
 *   x = longitudinal (m, positive forward), y = transverse (m, positive starboard),
 *   z = vertical (m, positive up, 0 = baseline / lowest keel reference).
 * The hull is defined by transverse stations (half-breadth b at height z).
 * Between control points interpolation is linear, so intentional chines are kept.
 * This geometry is for buoyancy/physics only and is separate from any render mesh.
 * Asymmetric hulls, multihulls and outriggers are NOT supported yet.
 */
const EPS = 1e-9;
const lerp = (a, b, w) => a + (b - a) * w;

function assertFinite(v, name) {
  if (!Number.isFinite(v)) throw new TypeError(`${name} must be a finite number`);
}

function validateStations(stations) {
  if (!Array.isArray(stations) || stations.length < 2) throw new TypeError('hull.stations needs at least 2 stations');
  stations.forEach((st, i) => {
    assertFinite(st?.x, `stations[${i}].x`);
    if (i && st.x <= stations[i - 1].x) throw new RangeError('stations must be sorted by strictly increasing x');
    if (!Array.isArray(st.points) || st.points.length < 2) throw new TypeError(`stations[${i}] needs at least 2 points`);
    st.points.forEach((p, j) => {
      assertFinite(p?.z, `stations[${i}].points[${j}].z`);
      assertFinite(p?.b, `stations[${i}].points[${j}].b`);
      if (p.b < 0) throw new RangeError('half-breadth b must be >= 0');
      if (j && p.z <= st.points[j - 1].z) throw new RangeError('station points must have strictly increasing z');
    });
  });
}

/** Half-breadth of a profile at height z: 0 below its keel, top breadth above its top. */
function breadthAtZ(points, z) {
  if (z < points[0].z - EPS) return 0;
  const top = points[points.length - 1];
  if (z >= top.z) return top.b;
  for (let i = 1; i < points.length; i++) {
    if (z <= points[i].z) {
      const a = points[i - 1], c = points[i];
      return lerp(a.b, c.b, (z - a.z) / (c.z - a.z));
    }
  }
  return top.b;
}

/** Closed section polygon [[y, z], ...] (starboard upward, then port downward). */
function sectionPolygon(profile) {
  const poly = [];
  if (profile[0].b > EPS) poly.push([0, profile[0].z]);
  for (const p of profile) poly.push([p.b, p.z]);
  for (let i = profile.length - 1; i >= 0; i--) poly.push([-profile[i].b, profile[i].z]);
  return poly;
}

function createHull({ stations } = {}) {
  validateStations(stations);
  const st = stations.map((s) => Object.freeze({ x: s.x, points: Object.freeze(s.points.map((p) => Object.freeze({ z: p.z, b: p.b }))) }));
  const xMin = st[0].x, xMax = st[st.length - 1].x;
  const sliceCache = new Map();

  function sectionAt(x) {
    if (!(x >= xMin && x <= xMax)) return null;
    let i = 0;
    while (i < st.length - 2 && x > st[i + 1].x) i++;
    const A = st[i].points, B = st[i + 1].points, w = (x - st[i].x) / (st[i + 1].x - st[i].x);
    const zKeel = lerp(A[0].z, B[0].z, w), zTop = lerp(A[A.length - 1].z, B[B.length - 1].z, w);
    const zs = new Set([zKeel, zTop]);
    for (const p of [...A, ...B]) if (p.z > zKeel && p.z < zTop) zs.add(p.z);
    return [...zs].sort((a, b) => a - b).map((z) => ({ z, b: lerp(breadthAtZ(A, z), breadthAtZ(B, z), w) }));
  }

  /** Midpoint slices along x, cached per count. */
  function slices(count = 80) {
    if (!Number.isInteger(count) || count < 2) throw new RangeError('slice count must be an integer >= 2');
    if (!sliceCache.has(count)) {
      const dx = (xMax - xMin) / count, out = [];
      for (let k = 0; k < count; k++) {
        const x = xMin + (k + 0.5) * dx, profile = sectionAt(x);
        out.push(Object.freeze({ x, dx, profile, poly: sectionPolygon(profile) }));
      }
      sliceCache.set(count, Object.freeze(out));
    }
    return sliceCache.get(count);
  }

  return Object.freeze({ stations: Object.freeze(st), xMin, xMax, sectionAt, slices });
}

return { breadthAtZ, sectionPolygon, createHull };
})();
const M_mass = (() => {
/**
 * Mass and centre of gravity: M = Σ m_i, G = Σ(m_i r_i) / Σ m_i.
 * Each item is a reference to a real object (structure group, cargo lot, person,
 * equipment, ballast). Duplicate ids are rejected to avoid double counting.
 * Items may carry refs (e.g. inventoryRef, personId) to existing ledgers.
 */
function computeMassProperties(items) {
  if (!Array.isArray(items) || items.length === 0) throw new TypeError('massItems must be a non-empty array');
  const ids = new Set();
  let m = 0, mx = 0, my = 0, mz = 0;
  for (const it of items) {
    if (typeof it?.id !== 'string' || !it.id) throw new TypeError('each mass item needs a string id');
    if (ids.has(it.id)) throw new RangeError(`duplicate mass item id: ${it.id}`);
    ids.add(it.id);
    for (const k of ['massKg', 'x', 'y', 'z']) {
      if (!Number.isFinite(it[k])) throw new TypeError(`mass item ${it.id}: ${k} must be finite`);
    }
    if (it.massKg < 0) throw new RangeError(`mass item ${it.id}: massKg must be >= 0`);
    m += it.massKg; mx += it.massKg * it.x; my += it.massKg * it.y; mz += it.massKg * it.z;
  }
  if (m <= 0) throw new RangeError('total mass must be > 0');
  return Object.freeze({ massKg: m, cg: Object.freeze({ x: mx / m, y: my / m, z: mz / m }) });
}

return { computeMassProperties };
})();
const M_hydrostatics = (() => {
/**
 * Static hydrostatics for the ship prototype (Ver.7 basic design).
 * F_B = ρ g ∇ ; equilibrium = weight/buoyancy balance with free trim.
 * GZ(φ) is computed from the actual submerged shape at each heel angle (not from GM).
 * GM is reported only as an auxiliary small-angle indicator.
 * Assumptions (prototype, NOT approved rules):
 *  - The hull is treated as watertight up to the top of each section (deck/gunwale).
 *    Openings are only checked for submergence (downflooding angle); flooding,
 *    free-surface effects and internal water are not modelled yet.
 *  - Calm water, static equilibrium. No waves, wind or dynamics.
 */
const { breadthAtZ } = M_hull_geometry;
const { computeMassProperties } = M_mass;
const WATER_DENSITY = Object.freeze({ seawater: 1025, freshwater: 1000 }); // kg/m^3
const DEG = Math.PI / 180;

const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

/** Earth-up unit vector in the ship frame. heel>0: starboard down, trim>0: bow down. */
function waterNormal(heel, trim) {
  return [-Math.sin(trim), -Math.sin(heel) * Math.cos(trim), Math.cos(heel) * Math.cos(trim)];
}

/** Keep the part of polygon where ay*y + az*z <= k (Sutherland–Hodgman, one half-plane). */
function clip(poly, ay, az, k) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const P = poly[i], Q = poly[(i + 1) % poly.length];
    const dp = ay * P[0] + az * P[1] - k, dq = ay * Q[0] + az * Q[1] - k;
    if (dp <= 0) out.push(P);
    if ((dp < 0 && dq > 0) || (dp > 0 && dq < 0)) {
      const t = dp / (dp - dq);
      out.push([P[0] + t * (Q[0] - P[0]), P[1] + t * (Q[1] - P[1])]);
    }
  }
  return out;
}

function areaCentroid(poly) {
  let a = 0, cy = 0, cz = 0;
  for (let i = 0; i < poly.length; i++) {
    const [y0, z0] = poly[i], [y1, z1] = poly[(i + 1) % poly.length];
    const c = y0 * z1 - y1 * z0;
    a += c; cy += (y0 + y1) * c; cz += (z0 + z1) * c;
  }
  a *= 0.5;
  if (Math.abs(a) < 1e-12) return null;
  return { area: Math.abs(a), y: cy / (6 * a), z: cz / (6 * a) };
}

/** Submerged volume and centre of buoyancy below the plane n·p = c. */
function submergedVolume(slices, n, c) {
  let v = 0, mx = 0, my = 0, mz = 0;
  for (const s of slices) {
    const part = clip(s.poly, n[1], n[2], c - n[0] * s.x);
    if (part.length < 3) continue;
    const ac = areaCentroid(part);
    if (!ac) continue;
    const dv = ac.area * s.dx;
    v += dv; mx += s.x * dv; my += ac.y * dv; mz += ac.z * dv;
  }
  return v > 0 ? { volume: v, centroid: [mx / v, my / v, mz / v] } : { volume: 0, centroid: null };
}

/** Illinois (modified regula falsi). Returns null if [lo, hi] does not bracket a root. */
function findRoot(f, lo, hi, { ftol = 1e-12, xtol = 1e-10, maxIter = 100 } = {}) {
  let flo = f(lo), fhi = f(hi);
  if (flo === 0) return lo;
  if (fhi === 0) return hi;
  if (Math.sign(flo) === Math.sign(fhi)) return null;
  let side = 0, x = lo;
  for (let i = 0; i < maxIter; i++) {
    x = (lo * fhi - hi * flo) / (fhi - flo);
    const fx = f(x);
    if (Math.abs(fx) <= ftol || hi - lo <= xtol) return x;
    if (Math.sign(fx) === Math.sign(fhi)) { hi = x; fhi = fx; if (side === 1) flo /= 2; side = 1; }
    else { lo = x; flo = fx; if (side === -1) fhi /= 2; side = -1; }
  }
  return x;
}

function floatAt(slices, volume, n) {
  let lo = Infinity, hi = -Infinity;
  for (const s of slices) for (const [y, z] of s.poly) {
    const d = n[0] * s.x + n[1] * y + n[2] * z;
    if (d < lo) lo = d;
    if (d > hi) hi = d;
  }
  const c = findRoot((cc) => submergedVolume(slices, n, cc).volume - volume, lo, hi, { ftol: volume * 1e-12 });
  if (c === null) return null;
  return { c, ...submergedVolume(slices, n, c) };
}

/** Righting arm (roll) and trimming arm (pitch) from B−G and the up vector n. */
function arms(B, G, n) {
  const m = cross([B[0] - G[0], B[1] - G[1], B[2] - G[2]], n);
  const eL = [1 - n[0] * n[0], -n[0] * n[1], -n[0] * n[2]];
  const len = Math.hypot(...eL);
  const eLn = eL.map((v) => v / len);
  return { roll: dot(m, eLn), pitch: dot(m, cross(n, eLn)) };
}

/** Free-trim equilibrium at a fixed heel angle (radians). G is [x,y,z] or a function of the water normal (moving internal water). */
function equilibriumAtHeel(slices, volume, G, heel, trimLimit = 20 * DEG) {
  const evalTrim = (trim) => {
    const n = waterNormal(heel, trim), f = floatAt(slices, volume, n);
    return f ? { trim, n, ...f, ...arms(f.centroid, typeof G === 'function' ? G(n) : G, n) } : null;
  };
  let failed = false;
  const trim = findRoot((t) => {
    const r = evalTrim(t);
    if (!r) { failed = true; return NaN; }
    return r.pitch;
  }, -trimLimit, trimLimit, { ftol: 1e-10, xtol: 1e-10, maxIter: 80 });
  if (failed || trim === null || !Number.isFinite(trim)) return { status: 'trim_out_of_range', heel };
  const r = evalTrim(trim);
  return { status: 'ok', heel, trim, normal: r.n, c: r.c, volume: r.volume, buoyancyCentre: r.centroid, gz: r.roll };
}

const DEFAULT_ANGLES = Object.freeze(Array.from({ length: 19 }, (_, i) => i * 5));

/**
 * Analyse a ship: mass properties, upright floating condition, GZ curve,
 * downflooding angles of openings, and static heel from an off-centre CG.
 */
function analyzeHydrostatics(ship, { waterDensity = WATER_DENSITY.seawater, sliceCount = 80, heelAnglesDeg = DEFAULT_ANGLES, trimLimitDeg = 20 } = {}) {
  if (!Number.isFinite(waterDensity) || waterDensity <= 0) throw new RangeError('waterDensity must be > 0');
  const { hull, openings = [] } = ship;
  const mass = computeMassProperties(ship.massItems);
  const G = [mass.cg.x, mass.cg.y, mass.cg.z];
  const requiredVolume = mass.massKg / waterDensity;
  const slices = hull.slices(sliceCount);
  const hullVolume = submergedVolume(slices, [0, 0, 1], Infinity).volume;
  if (requiredVolume >= hullVolume) {
    return { status: 'insufficient_buoyancy', mass, requiredVolume, hullVolume };
  }
  const lim = trimLimitDeg * DEG;
  const up = equilibriumAtHeel(slices, requiredVolume, G, 0, lim);
  if (up.status !== 'ok') return { status: up.status, mass, requiredVolume, hullVolume };

  const wlZ = (x) => (up.c - up.normal[0] * x) / up.normal[2];
  let inertiaT = 0, waterplaneArea = 0;
  for (const s of slices) {
    const b = breadthAtZ(s.profile, wlZ(s.x));
    inertiaT += (2 / 3) * b ** 3 * s.dx;
    waterplaneArea += 2 * b * s.dx;
  }
  const KB = up.buoyancyCentre[2], BM = inertiaT / requiredVolume;
  const upright = {
    displacementKg: mass.massKg,
    volume: requiredVolume,
    draftAft: wlZ(hull.xMin), draftMid: wlZ((hull.xMin + hull.xMax) / 2), draftFore: wlZ(hull.xMax),
    trimDeg: up.trim / DEG,
    LCB: up.buoyancyCentre[0], KB, BM, KM: KB + BM, KG: G[2], GM: KB + BM - G[2],
    waterplaneArea,
  };

  const curve = heelAnglesDeg.map((deg) => {
    const e = equilibriumAtHeel(slices, requiredVolume, G, deg * DEG, lim);
    return e.status === 'ok'
      ? { heelDeg: deg, status: 'ok', gz: e.gz, trimDeg: e.trim / DEG, normal: e.normal, c: e.c }
      : { heelDeg: deg, status: e.status, gz: null };
  });

  const ok = curve.filter((p) => p.status === 'ok');
  let maxGz = null, angleOfMaxGzDeg = null, vanishingAngleDeg = null;
  for (const p of ok) if (maxGz === null || p.gz > maxGz) { maxGz = p.gz; angleOfMaxGzDeg = p.heelDeg; }
  for (let i = 1; i < ok.length; i++) {
    const a = ok[i - 1], b = ok[i];
    if (a.heelDeg >= angleOfMaxGzDeg && a.gz > 0 && b.gz <= 0) {
      vanishingAngleDeg = a.heelDeg + (b.heelDeg - a.heelDeg) * a.gz / (a.gz - b.gz);
      break;
    }
  }

  const downflooding = openings.map((o) => {
    const p = [o.x, o.y, o.z];
    let prev = null, angle = null;
    for (const q of ok) {
      const s = dot(q.normal, p) - q.c; // < 0 means below the waterplane
      if (s < 0) {
        angle = prev ? prev.deg + (q.heelDeg - prev.deg) * prev.s / (prev.s - s) : q.heelDeg;
        break;
      }
      prev = { deg: q.heelDeg, s };
    }
    return { id: o.id, downfloodingAngleDeg: angle };
  });

  let staticHeelDeg = 0;
  if (Math.abs(G[1]) > 1e-12) {
    const h = findRoot((phi) => {
      const e = equilibriumAtHeel(slices, requiredVolume, G, phi, lim);
      return e.status === 'ok' ? e.gz : NaN;
    }, -60 * DEG, 60 * DEG, { ftol: 1e-9, xtol: 1e-9, maxIter: 80 });
    staticHeelDeg = h === null || !Number.isFinite(h) ? null : h / DEG;
  }

  return {
    status: 'ok', mass, requiredVolume, hullVolume, reserveBuoyancyVolume: hullVolume - requiredVolume,
    upright, staticHeelDeg,
    gzCurve: curve.map(({ normal, c, ...rest }) => rest),
    summary: { maxGz, angleOfMaxGzDeg, vanishingAngleDeg },
    downflooding,
  };
}

return { WATER_DENSITY, waterNormal, submergedVolume, findRoot, floatAt, equilibriumAtHeel, analyzeHydrostatics };
})();
const M_hull_params = (() => {
/**
 * Derives manoeuvring parameters (waterline length, wetted surface, lateral area...)
 * from the physics hull and an upright hydrostatics result. Read-only helper.
 */
const { breadthAtZ } = M_hull_geometry;
function deriveHullParams(ship, analysis, { sliceCount = 80 } = {}) {
  if (analysis?.status !== 'ok') throw new RangeError('hydrostatics analysis must have status ok');
  const { hull } = ship, u = analysis.upright, slices = hull.slices(sliceCount);
  const wl = (x) => u.draftAft + (u.draftFore - u.draftAft) * (x - hull.xMin) / (hull.xMax - hull.xMin);
  let lat = 0, latMoment = 0, wetted = 0, beam = 0, xMinW = Infinity, xMaxW = -Infinity;
  for (const s of slices) {
    const zw = wl(s.x), zk = s.profile[0].z;
    if (zw <= zk) continue;
    const depth = zw - zk;
    lat += depth * s.dx; latMoment += depth * s.dx * s.x;
    const b = breadthAtZ(s.profile, zw);
    beam = Math.max(beam, 2 * b);
    if (b > 1e-6) { xMinW = Math.min(xMinW, s.x - s.dx / 2); xMaxW = Math.max(xMaxW, s.x + s.dx / 2); }
    let per = 2 * s.profile[0].b, prev = s.profile[0];
    for (let i = 1; i < s.profile.length && prev.z < zw; i++) {
      const p = s.profile[i], z1 = Math.min(p.z, zw), b1 = breadthAtZ(s.profile, z1);
      per += 2 * Math.hypot(b1 - prev.b, z1 - prev.z);
      prev = { z: z1, b: b1 };
    }
    wetted += per * s.dx;
  }
  return Object.freeze({
    massKg: analysis.mass.massKg, cgX: analysis.mass.cg.x,
    waterlineLengthM: xMaxW - xMinW, beamM: beam, draftM: u.draftMid, waterlineZ: u.draftMid,
    wettedAreaM2: wetted, lateralAreaM2: lat, clrX: latMoment / lat,
  });
}

return { deriveHullParams };
})();
const M_dynamics = (() => {
/**
 * 2D (surge, sway, yaw) vessel dynamics prototype (Ver.8/9/11 basic design).
 * World frame: X east, Y north (m). Heading psi: clockwise from north (rad).
 * Body frame: x forward, y STARBOARD (same as the hull frame), r = dpsi/dt (+ = turning to starboard).
 *  forward = (sin psi, cos psi), starboard = (cos psi, -sin psi)

$('oe').disabled = true;
