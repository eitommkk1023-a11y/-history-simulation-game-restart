<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>World of History — 村の成長・造形試作01</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#23323a;color:#ece7d4;font:14px system-ui;touch-action:none}canvas{display:block;width:100%;height:100%}button,select,input{font:inherit;min-height:44px;touch-action:manipulation}button,select{background:#20343bee;border:1px solid #8c967e;border-radius:5px;color:inherit;padding:0 10px}button[aria-pressed=true]{background:#715f35;border-color:#e5c37c}header{position:fixed;top:env(safe-area-inset-top);left:env(safe-area-inset-left);right:env(safe-area-inset-right);display:flex;align-items:center;gap:6px;padding:6px 8px;background:#14262bde;z-index:2}header b{font-size:12px;margin-right:auto}#stats{position:fixed;left:12px;top:64px;font-size:11px;white-space:pre-line;line-height:1.6;background:#14272bbd;border-radius:6px;padding:8px;pointer-events:none}#controls{position:fixed;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;padding:8px;background:#14272be8;border:1px solid #708277;border-radius:8px}#controls label{display:flex;flex-direction:column;gap:2px;font-size:11px;min-width:90px;flex:1}#controls label.wide{min-width:120px}#controls select{width:100%;font-size:16px}#controls input{width:100%;min-width:70px}#controls [hidden]{display:none}#hint{position:fixed;right:12px;top:65px;max-width:230px;font-size:11px;background:#14272bb0;padding:8px;border-radius:6px;pointer-events:none}#error{position:fixed;top:30%;left:10%;right:10%;background:#702e29;padding:18px;z-index:10;white-space:pre-wrap}#error[hidden]{display:none}@media(max-height:450px){header b{display:none}header button{font-size:12px;flex:1;padding:0 5px}#hint{max-width:170px;font-size:10px}#controls{gap:5px;padding:5px}#controls label{min-width:75px;font-size:10px}#stats{top:60px;font-size:10px}}@media(orientation:portrait){header{flex-wrap:wrap}#controls{max-height:45%;overflow:auto;touch-action:pan-y}#stats{top:110px}}
</style></head><body><canvas id="world" aria-label="村の成長の造形試作"></canvas><header><b>VILLAGE LAB 01</b><button data-view="fields" aria-pressed="true">畑・作物</button><button data-view="animals">家畜</button><button data-view="facilities">施設</button><button data-view="village">村全体</button><button data-view="stress">200区画＋500頭</button></header><div id="stats"></div><div id="hint">画面ドラッグで回転、ホイール／ピンチで拡大。<br>本編の農耕・人口・建設処理とは独立した造形試作です。</div><form id="controls" onsubmit="return false">
<label data-for="fields village stress">区画<select id="plotKind"><option value="-1">3形状</option><option value="0">畝・長方形</option><option value="1">棚田状</option><option value="2">丸い菜園</option></select></label><label data-for="fields village stress">作物<select id="crop"><option value="-1">3系統</option><option value="0">穀物</option><option value="1">根菜・豆</option><option value="2">実り物</option></select></label><label data-for="fields village stress">生育<select id="stage"><option value="0">0 耕した土</option><option value="1">1 芽</option><option value="2">2 伸びる</option><option value="3" selected>3 実る</option><option value="4">4 刈り跡</option></select></label><label data-for="fields village stress">進み<input id="progress" type="range" min="0" max="1" step=".01" value=".6" aria-label="生育段階内の進み"></label><label data-for="fields village stress">色・背丈<input id="tint" type="range" min="0" max="1" step=".01" value=".5" aria-label="作物の色と背丈"></label>
<label data-for="animals">体型<select id="animalKind"><option value="-1">4体型</option><option value="0">大型・牛系</option><option value="1">中型・山羊羊系</option><option value="2">猪・豚系</option><option value="3">鳥・鶏系</option></select></label><label data-for="animals village stress">動き<select id="animalState"><option value="0">idle</option><option value="1" selected>graze</option><option value="2">walk</option><option value="3">lie（牛・山羊）</option></select></label>
<label data-for="facilities">施設<select id="role"><option value="-1">8施設</option><option value="0">高床倉庫</option><option value="1">貯蔵穴</option><option value="2">干し棚</option><option value="3">井戸</option><option value="4">家畜の囲い</option><option value="5">共同の炉</option><option value="6">物見櫓</option><option value="7">土器の窯</option></select></label><label data-for="facilities village stress">壁<select id="wall"><option value="0">木</option><option value="3">土</option><option value="1">石</option></select></label><label data-for="facilities village stress">屋根<select id="roof"><option value="0">草</option><option value="1">板</option><option value="3">土・平屋根</option></select></label><label data-for="facilities">状態<select id="condition"><option value="0">新築</option><option value="1" selected>通常</option><option value="2">老朽</option><option value="3">廃屋</option></select></label><label data-for="facilities">寸法<select id="size"><option value=".7">小さめ</option><option value="1" selected>標準</option><option value="1.4">大きめ</option></select></label><label>LOD<select id="lod"><option value="-1">自動</option><option value="0">近景</option><option value="1">遠景</option></select></label>
</form><div id="error" hidden></div><!--THREE--><!--APP--></body></html>
