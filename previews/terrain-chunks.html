<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>World of History — 歩行プレビュー</title>
<style>
  *{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;background:#a8c8dc;color:#edf3f9;font:14px system-ui}
  canvas{display:block;touch-action:none}header{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));z-index:2;max-width:680px;background:#142536ee;padding:10px;border-radius:12px;max-height:calc(100dvh - 100px);overflow:auto}
  h1{font-size:16px;margin:0 0 4px}p{margin:8px 0 0;line-height:1.5}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button,input,summary{font:inherit;touch-action:manipulation}button{padding:9px;border:0;border-radius:7px;background:#3774a8;color:white;min-height:44px;min-width:44px}button:disabled{opacity:.5}
  input[type=number]{width:110px;padding:8px;min-height:44px}input[type=range]{max-width:140px;min-height:44px}input[type=checkbox]{width:22px;height:22px}label{display:flex;gap:6px;align-items:center;min-height:44px}summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
  #status{margin:8px 0 0;color:#cbdce8;max-height:60px;overflow:auto}#orientationHint{display:none;margin:4px 0 0;color:#ffe2a8}
  @media(orientation:portrait){#orientationHint{display:block}}
  @media(orientation:landscape) and (max-height:500px){header{max-width:620px;padding:6px 10px}h1{font-size:14px}header p{font-size:12px;margin-top:4px}.controls{gap:5px}}
  #joystick{position:fixed;z-index:3;left:max(20px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;background:#14253688;border:2px solid #ffffff88;touch-action:none;user-select:none;display:grid;place-items:center;padding:0}
  #stick{width:46px;height:46px;border-radius:50%;background:#d9e9f4bb;pointer-events:none}
  #sprint.active{background:#aa7821}#movementNotice{position:fixed;bottom:26px;left:150px;right:120px;text-align:center;pointer-events:none;text-shadow:0 1px 4px #000;color:white}
  [hidden]{display:none!important}body.ui-hidden header,body.ui-hidden #movementNotice{display:none!important}
  #uiToggle{position:fixed;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:5;background:#183d5ccc}
  header{right:100px}#sprint.active{background:#efb52c;color:#172436;box-shadow:0 0 12px 5px #ffd34eaa}
  #actions{position:fixed;z-index:3;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,64px);gap:12px}
  #actions button{width:64px;height:64px;border-radius:50%;background:#183d5ce8;touch-action:none;user-select:none;padding:4px;font-size:12px}
  #actions #jump{grid-column:2;grid-row:1}#actions #sprint{grid-column:1;grid-row:2}#actions #crouch{grid-column:2;grid-row:2}
  #actions button.active{background:#efb52c;color:#172436;box-shadow:0 0 8px 3px #ffd34e88}
</style>
<button id="uiToggle" aria-pressed="false">UIを隠す</button>
<header>
  <h1>World of History · 歩行プレビュー</h1>
  <details id="settings" open>
  <summary>設定・地形生成 ▾</summary>
  <div class="controls">
    <button id="viewMode">周辺を俯瞰</button>
    <button id="fixture">固定テスト地形</button>
    <input id="seed" type="number" inputmode="numeric" min="0" max="4294967295" value="12345" aria-label="数値Seed">
    <button id="generate">既存世界を生成</button>
    <label><input id="wire" type="checkbox">格子を表示</label>
    <label id="overviewDistance" hidden>俯瞰距離<input id="distance" type="range" min="20" max="300" value="100"></label>
  </div>
  <p>三人称：左で歩行・右で見回し。ダッシュはタップで切替、停止すると解除。俯瞰：左でカメラ移動・右で回転、距離バーで拡縮。ジャンプボタン／Spaceでジャンプ。しゃがみはボタン／Cで切替。PCはWASD／矢印・Shift。</p>
  <p id="status" role="status">準備中…</p>
  </details>
  <p id="orientationHint">端末を横向きにすると、広く見渡せます。</p>
</header>
<button id="joystick" aria-label="移動スティック"><span id="stick"></span></button>
<div id="actions">
<button id="sprint" aria-label="ダッシュ切替" aria-pressed="false">ダッシュ</button>
<button id="jump" aria-label="ジャンプ">ジャンプ</button>
<button id="crouch" aria-label="しゃがみ切替" aria-pressed="false">しゃがむ</button>
</div>
<div id="movementNotice" role="status"></div>
<script>
  window.addEventListener('error',e=>document.getElementById('status').textContent='エラー: '+e.message);
  window.addEventListener('unhandledrejection',e=>document.getElementById('status').textContent='エラー: '+e.reason);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="./terrain-chunks.mjs"></script>
</html>
